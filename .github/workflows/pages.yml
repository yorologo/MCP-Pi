name: GitHub Pages

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML structure
        run: npx --yes --package=vnu-jar@26.8.30 vnu --errors-only site/index.html

      - name: Run site test suite (i18n, theme, demo, contracts, accessibility)
        run: node --test site/tests/site.test.mjs

      - name: Rebuild Tailwind CSS
        run: npx --yes tailwindcss@3.4.17 -c site/tailwind.config.js -i ./site/assets/css/tailwind-input.css -o ./site/assets/css/site.generated.css --minify

      - name: Verify committed CSS matches generated
        run: |
          cmp site/assets/css/site.css site/assets/css/site.generated.css
          rm site/assets/css/site.generated.css

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

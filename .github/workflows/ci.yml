name: CI

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp-adapter/go.mod
          cache-dependency-path: mcp-adapter/go.sum

      - name: Go tests
        working-directory: mcp-adapter
        run: go test -count=1 ./...

      - name: Go vet
        working-directory: mcp-adapter
        run: go vet ./...

      - name: Go module hygiene
        working-directory: mcp-adapter
        run: go mod tidy -diff

      - name: Go vulnerability reachability
        working-directory: mcp-adapter
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: ARMv6 cross-build
        working-directory: mcp-adapter
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '6'
          CGO_ENABLED: '0'
        run: go build -trimpath -o "$RUNNER_TEMP/mcp-gateway-adapter-armv6" .

      - name: Go-only product invariant
        run: scripts/verify-go-only.sh

      - name: Shell static analysis
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning install.sh scripts/*.sh config/systemd/mcp-gateway-network-recovery

      - name: Shell syntax contract
        run: |
          sh -n install.sh
          sh -n config/systemd/mcp-gateway-network-recovery
          bash -n scripts/build-release-package.sh
          bash -n scripts/deploy-pi.sh
          bash -n scripts/run-resumable.sh
          bash -n scripts/verify-go-only.sh


      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tailwind/package-lock.json

      - name: Frontend dependencies
        working-directory: tailwind
        run: npm ci

      - name: JavaScript tests
        run: node mcp-adapter/internal/admin/app_js_test.mjs

      - name: Tailwind build
        working-directory: tailwind
        run: npm run build

      - name: Diff hygiene
        run: git diff --check && git diff --exit-code

      - name: Build and inspect ARMv6 release bundle
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/release-extract"
          scripts/build-release-package.sh "$GITHUB_SHA" "$RUNNER_TEMP/release"

          pkg="$(find "$RUNNER_TEMP/release" -maxdepth 1 -name 'MCP-Pi-*-linux-armv6-*.tar.gz' -print -quit)"
          test -n "$pkg"

          contents="$RUNNER_TEMP/release.contents"
          tar -tzf "$pkg" > "$contents"
          grep -q '/bin/mcp-gateway-adapter$' "$contents"
          grep -q '/install.sh$' "$contents"
          if grep -E '/src/mcp_gateway|/requirements[.]txt$|[.]py$' "$contents"; then
            echo "Python payload found in release bundle" >&2
            exit 1
          fi

          # Build under restrictive umask, then extract with deployment semantics.
          umask 022
          tar -xzf "$pkg" -C "$RUNNER_TEMP/release-extract"
          root="$(find "$RUNNER_TEMP/release-extract" -mindepth 1 -maxdepth 1 -type d -name 'MCP-Pi-*' -print -quit)"
          test -n "$root"
          test -x "$root/bin/mcp-gateway-adapter"
          test -x "$root/bin/mcp-gateway"
          test -x "$root/bin/mcp-gateway-client-stdio"

          # Distributed documentation must not reference retired lifecycle helpers.
          if grep -R -E 'backup-appliance[.]sh|build-armv6[.]sh|mcp-gateway repair|--skip-password' "$root/docs"; then
            echo "Release documentation references a retired lifecycle path" >&2
            exit 1
          fi

          # Package metadata must be the exact metadata validated in this checkout.
          cmp manifest.json "$root/manifest.json"
          cmp compatibility.json "$root/compatibility.json"

          bad_dir="$(find "$root" -type d ! -perm -0005 -print -quit)"
          if [ -n "$bad_dir" ]; then
            echo "Release contains a directory not traversable by the service account: $bad_dir" >&2
            exit 1
          fi

          (cd "$root" && sha256sum -c SHA256SUMS)
          sha256sum "$pkg"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp-adapter/go.mod
          cache-dependency-path: mcp-adapter/go.sum

      - name: Verify immutable version tag
        run: |
          version="$(awk -F'"' '/GatewayVersion[[:space:]]*=/{print $2; exit}' mcp-adapter/internal/buildinfo/buildinfo.go)"
          test "v$version" = "$GITHUB_REF_NAME"
          # checkout@v4 normalizes the event tag ref to the commit after its full
          # fetch. Restore the immutable remote tag object before verifying it.
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"

      - name: Build canonical ARMv6 release bundle
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          scripts/build-release-package.sh "$GITHUB_SHA" "$RUNNER_TEMP/release"
          pkg="$(find "$RUNNER_TEMP/release" -maxdepth 1 -name 'MCP-Pi-*-linux-armv6-*.tar.gz' -print -quit)"
          test -n "$pkg"
          base="$(basename "$pkg")"
          (cd "$(dirname "$pkg")" && sha256sum "$base" > "$base.sha256")
          echo "PACKAGE=$pkg" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$base" >> "$GITHUB_ENV"

      - name: Publish or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checksum="$PACKAGE.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download "$GITHUB_REF_NAME" \
              --dir "$RUNNER_TEMP/existing-release" \
              --pattern "$PACKAGE_NAME" \
              --pattern "$PACKAGE_NAME.sha256"
            cmp "$PACKAGE" "$RUNNER_TEMP/existing-release/$PACKAGE_NAME"
            cmp "$checksum" "$RUNNER_TEMP/existing-release/$PACKAGE_NAME.sha256"
            echo "RELEASE_ALREADY_VERIFIED"
          else
            gh release create "$GITHUB_REF_NAME" "$PACKAGE" "$checksum" \
              --verify-tag \
              --title "MCP-Pi Gateway $GITHUB_REF_NAME" \
              --generate-notes
            echo "RELEASE_PUBLISHED"
          fi

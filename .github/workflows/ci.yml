name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp-adapter/go.mod
          cache-dependency-path: mcp-adapter/go.sum
      - name: Go tests
        working-directory: mcp-adapter
        run: go test -count=1 ./...
      - name: ARMv6 cross-build
        working-directory: mcp-adapter
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '6'
          CGO_ENABLED: '0'
        run: go build -trimpath -o "$RUNNER_TEMP/mcp-gateway-adapter-armv6" .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tailwind/package-lock.json
      - name: Frontend dependencies
        working-directory: tailwind
        run: npm ci
      - name: JavaScript tests
        run: node tests/test_app_js.mjs
      - name: Tailwind build
        working-directory: tailwind
        run: npm run build
      - name: Documentation audit
        run: PYTHONPATH=src python scripts/audit-docs.py
      - name: Diff hygiene
        run: git diff --check && git diff --exit-code
      - name: Build beginner ARMv6 release bundle
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          scripts/build-release-package.sh "$GITHUB_SHA" "$RUNNER_TEMP/release"
          pkg="$(find "$RUNNER_TEMP/release" -maxdepth 1 -name 'MCP-Pi-*-linux-armv6-*.tar.gz' -print -quit)"
          test -n "$pkg"
          tar -tzf "$pkg" | grep -q '/bin/mcp-gateway-adapter$'
          tar -tzf "$pkg" | grep -q '/install.sh$'
          sha256sum "$pkg"


  windows-transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Windows transport tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_windows_transport.py" -v

name: CI

on:
  push:
    branches: [develop, main, go-only-migration]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp-adapter/go.mod
          cache-dependency-path: mcp-adapter/go.sum

      - name: Go tests
        working-directory: mcp-adapter
        run: go test -count=1 ./...

      - name: Go vet
        working-directory: mcp-adapter
        run: go vet ./...

      - name: Go module hygiene
        working-directory: mcp-adapter
        run: go mod tidy -diff

      - name: Go vulnerability reachability
        working-directory: mcp-adapter
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: ARMv6 cross-build
        working-directory: mcp-adapter
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '6'
          CGO_ENABLED: '0'
        run: go build -trimpath -o "$RUNNER_TEMP/mcp-gateway-adapter-armv6" .

      - name: Go-only product invariant
        run: scripts/verify-go-only.sh

      - name: Shell static analysis
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning install.sh scripts/*.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tailwind/package-lock.json

      - name: Frontend dependencies
        working-directory: tailwind
        run: npm ci

      - name: JavaScript tests
        run: node mcp-adapter/internal/admin/app_js_test.mjs

      - name: Tailwind build
        working-directory: tailwind
        run: npm run build

      - name: Diff hygiene
        run: git diff --check && git diff --exit-code

      - name: Build and inspect ARMv6 release bundle
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/release-extract"
          scripts/build-release-package.sh "$GITHUB_SHA" "$RUNNER_TEMP/release"
          pkg="$(find "$RUNNER_TEMP/release" -maxdepth 1 -name 'MCP-Pi-*-linux-armv6-*.tar.gz' -print -quit)"
          test -n "$pkg"
          tar -tzf "$pkg" > "$RUNNER_TEMP/release.contents"
          grep -q '/bin/mcp-gateway-adapter$' "$RUNNER_TEMP/release.contents"
          grep -q '/install.sh$' "$RUNNER_TEMP/release.contents"
          if grep -E '/(src/mcp_gateway|requirements[.]txt|[^/]+[.]py)          root="$(find "$RUNNER_TEMP/release-extract" -mindepth 1 -maxdepth 1 -type d -name 'MCP-Pi-*' -print -quit)"
          test -n "$root"
          test -x "$root/bin/mcp-gateway-adapter"
          test -x "$root/bin/mcp-gateway"
          test -x "$root/bin/mcp-gateway-client-stdio"
          if find "$root" -type d ! -perm -0005 -print -quit | grep -q .; then
            echo "Release contains a directory not traversable by the service account" >&2
            exit 1
          fi
          sha256sum -c "$root/SHA256SUMS"
          sha256sum "$pkg"
